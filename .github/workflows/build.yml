name: Build Stalker Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer ZIP del mod
        run: |
          mkdir -p source
          unzip -o STALKER_REIMAGINED_Forge_1.20.1_source.zip -d source

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar mod
        run: |
          FILE=$(find source -name build.gradle -print -quit)
          if [ -z "$FILE" ]; then
            echo "No se encontró build.gradle dentro del ZIP"
            exit 1
          fi
          cd "$(dirname "$FILE")"
          gradle build

      - name: Guardar JAR
        uses: actions/upload-artifact@v4
        with:
          name: STALKER-REIMAGINED-1.1.0
          path: source/**/build/libs/*.jar
          if-no-files-found: error
          
